<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0a0a0a" stroke="#1e1e1e" stroke-width="1"/>
  <text x="16" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#0f0" filter="url(#glow)">$</text>
</svg>
