# ══════════════════════════════════════════════════════════════════════════
# Enola CLI — ejemplo de configuración centralizada (CLIENTE)
# ══════════════════════════════════════════════════════════════════════════
#
# Documento: config.example.toml
# Versión: 2.5 | Actualizado: 2026-10-25
# Referencias: CONFIG-001..009, QUAL-001, QUAL-003, FASE-9-ASK
#
# Copia este fichero a `~/.enola/config.toml` y ajústalo a tu entorno.
# Permisos obligatorios:  chmod 0600 ~/.enola/config.toml
#
# Prioridad de resolución (alta → baja):
#   1. Flags CLI           (ej.  --web-url, --binary-base-url)
#   2. Variables de entorno (ENOLA_WEB_URL, …)
#
# COMO ROOT (sudo): de las variables ENOLA_* solo se conservan
# ENOLA_ACCEPT_LICENSE, ENOLA_MCP_CHILD y ENOLA_AUTO_SETUP; el resto se ignora
# con un aviso. Las claves de seguridad ([ai].endpoint, [ai].tor_proxy,
# [distribution], [update], [mcp], [http].tor_socks_proxy no-loopback) solo se
# leen de /etc/enola/config.toml (root-owned); en este fichero se ignoran.


# ── 1. URLs públicas de la web del proyecto ────────────────────────────────
# Env-vars equivalentes: ENOLA_WEB_URL, ENOLA_DOCS_URL
#
# Se usan en mensajes del CLI (quickref, errores) para dirigir al
# usuario al portal correcto. Si se dejan vacías, el CLI no muestra enlaces.
[web]
web_public_url = "https://github.com/SalvadorPalmaRodriguez/enola-cli-lite"
# docs_url     = "https://github.com/SalvadorPalmaRodriguez/enola-cli-lite#docs"   # opcional

# Variante .onion:
# web_public_url = "http://tudominio-abc123…56chars.onion"


# ── 2. Distribución (descarga de binarios) ─────────────────────────────────
# Env-var equivalente: ENOLA_BINARY_BASE_URL
# Como root: solo desde /etc/enola/config.toml o --binary-base-url.
[distribution]
# Base URL desde donde se descargan los artefactos de release.
# Si está vacío (default), se usa ruta relativa /releases/… sobre la web.
binary_base_url     = "https://github.com/SalvadorPalmaRodriguez/enola-cli-lite/releases/latest/download"
# (minisign_pubkey_url se eliminó: la clave de verificación es la embebida en el
#  binario, rotada solo por el feed firmado, o [update].minisign_pubkey en
#  /etc/enola/config.toml.)


# ── 3. Feed de actualizaciones / advisories (UPD-CLI-001) ─────────────────
# Env-var equivalente: ENOLA_UPDATE_FEED_URL
#
# Si se configura, `enola-cli update check` consulta este feed JSON para:
#   - detectar nuevas versiones disponibles,
#   - mostrar avisos de seguridad que afecten a tu versión,
#   - rastrear hitos PQC del roadmap.
#
# El endpoint puede vivir en clearweb o en `.onion`. Si usas `.onion`, el
# CLI lo enruta automáticamente por Tor (vía [http].tor_socks_proxy).
# Con euid 0 (sudo), [update] solo se lee de /etc/enola/config.toml
# (root-owned, !group/other-writable); ~/.enola/config.toml se ignora.
[update]
# feed_url = "https://salvadorpalmarodriguez.github.io/enola-cli-lite/releases/advisories.json"
# signature_url = "https://salvadorpalmarodriguez.github.io/enola-cli-lite/releases/advisories.json.minisig"

# feed_url = "https://salvadorpalmarodriguez.github.io/enola-cli-lite/releases/advisories.json"
# feed_url = "http://updates-abc123…56chars.onion/advisories.json"

# Firma minisign sidecar del feed. Si se omite, el CLI usa por defecto:
#   {feed_url}.minisig
# signature_url = "https://salvadorpalmarodriguez.github.io/enola-cli-lite/releases/advisories.json.minisig"

# Clave pública minisign para verificar el feed. Si se omite, el CLI usa la
# clave pública embebida del proyecto (`minisign.pub`). Úsala en forks o en
# despliegues white-label del operador.
# minisign_pubkey = "RWRkwMQHVPO0NGUahoNT1sLqJKM8QzlkfOOmSM0P+80x80GIw9P7BB8e"


# ── 4. HTTP / Tor (QUAL-003) ───────────────────────────────────────────────
# Proxy SOCKS5 que el CLI usa para cualquier petición a un `.onion`.
# El esquema `socks5h://` (con "h") delega la resolución DNS a Tor — crítico
# para no filtrar DNS fuera del circuito.
#
# Prioridad de resolución (alta → baja):
#   1. Flag CLI                  --tor-socks socks5h://HOST:PUERTO
#   2. Variable de entorno       ENOLA_TOR_SOCKS_PROXY=socks5h://...
#   3. Esta sección              [http].tor_socks_proxy = "..."
#   4. Default del binario       socks5h://127.0.0.1:9050
# Como root (sudo): la variable de entorno y el config.toml del usuario solo
# admiten socks5h:// en 127.0.0.1/::1/localhost; un proxy en otro host va en
# /etc/enola/config.toml (root-owned) o en --tor-socks.
[http]
# Tor local (por defecto):
tor_socks_proxy = "socks5h://127.0.0.1:9050"

# Tor Browser en la misma máquina (escucha en 9150):
# tor_socks_proxy = "socks5h://127.0.0.1:9150"

# Daemon Tor en host remoto de la LAN (bajo sudo: en /etc/enola/config.toml):
# tor_socks_proxy = "socks5h://10.0.0.5:9050"


# ── 5. Backups del sistema ─────────────────────────────────────────────────
# Env-var equivalente: ENOLA_MAX_BACKUPS
#
# Cuántos backups se conservan por servicio antes de rotar los más
# antiguos. Aplica a `maintenance backup` (system_full) y a los backups
# previos a `wp update`, restauraciones, etc. Mínimo: 1.
#
# Prioridad: `maintenance backup --keep N` > ENOLA_MAX_BACKUPS > este valor
# > default (5). Para cambiarlo sin editar el archivo:
#   sudo enola-cli maintenance backup-config --max-backups 3
[backup]
# max_backups = 5


# ── 6. Servidor MCP (`enola-cli mcp`) ──────────────────────────────────────
# Política de escritura y límites del servidor MCP.
# Prioridad: flag CLI > env var > esta sección > defaults seguros.
#
# - allow_write        → false: solo lectura (default, recomendado);
#                        true: habilita tools mutantes.
# - allowed_tools      → OBLIGATORIA con allow_write: nombres de tool
#                        (wp_create) o rutas (wp:create; family pelado para
#                        hojas como doctor).
# - allow_all_mutating → false; true = todas las mutantes sin allowlist
#                        (escape explícito, aviso). Sin variable de entorno.
#
# MCP-009: las tools DESTRUCTIVAS (wp_hide, tor_remove, wp_publish,
# tor_create, files_create, y vía enola_run_command todo `* delete|hide`,
# `tor create|edit|rotate`, `tor auth *`, `vpn create`, `* publish`,
# `firewall setup|allow|deny`, `apparmor setup|mode`, `git create`,
# `maintenance backup|cleanup|disable-checks|ssh-harden-pqc`,
# `update download`, ...) exigen además confirmación de dos pasos.
# Vetadas siempre: familias mcp, ssh, uninstall, web, setup y rutas
# update apply, test run, test benchmark.
# confirm_token monouso, vinculado a los args, TTL 300 s. Y `try_run: true`
# simula cualquier mutante sin efectos (misma política aplicada).
# - max_output_bytes   → límite de stdout/stderr por llamada (65536).
# - audit_log          → "stderr" o path absoluto (nunca stdout). Como root,
#                        solo en /var/log/enola/ o /var/lib/enola/.
# - request_timeout_secs → timeout por llamada a tool (60).
#
# Env vars: ENOLA_MCP_ALLOW_WRITE, ENOLA_MCP_ALLOWED_TOOLS,
#           ENOLA_MCP_MAX_OUTPUT_BYTES, ENOLA_MCP_AUDIT_LOG,
#           ENOLA_MCP_REQUEST_TIMEOUT_SECS
# Flags:    --allow-write --allow-tools --max-output-bytes
#           --audit-log --request-timeout-secs
[mcp]
# allow_write = false
# allowed_tools = []
# allow_all_mutating = false
# max_output_bytes = 65536
# audit_log = "stderr"
# request_timeout_secs = 60


# ── 7. IA local (`enola-cli ask` — Ollama) ─────────────────────────────────
# Configuración del asistente local `enola-cli ask`.
# Prioridad: flag CLI (--endpoint, --model, --instance) > env var >
#            esta sección > defaults (http://127.0.0.1:11434, llama3.1:8b, 120).
#
# Si `endpoint` apunta a un `.onion`, se enruta automáticamente por Tor
# vía `socks5h://` ([http].tor_socks_proxy).
#
# Env vars: ENOLA_AI_ENDPOINT, ENOLA_AI_MODEL, ENOLA_AI_TIMEOUT_SECS,
#           ENOLA_AI_USE_TOR_DOWNLOADS, ENOLA_AI_TOR_PROXY
# Flags:    --endpoint --model --instance --no-exec --yes --tor
# Como root: endpoint y tor_proxy solo desde /etc/enola/config.toml o flag;
# `ask` imprime el endpoint efectivo y su origen.
[ai]
# endpoint = "http://127.0.0.1:11434"
# model = "llama3.1:8b"
# timeout_secs = 120
# Si true, `ai model download` sale por Tor SOCKS5h (socks5h://127.0.0.1:9050)
# en lugar de clearnet. El flag --tor tiene prioridad sobre esta clave.
# use_tor_for_downloads = false
# Si true, las peticiones a providers externos (`ai provider test`,
# `ask --provider`) salen por Tor SOCKS5h en lugar de clearnet.
# El flag --tor tiene prioridad sobre esta clave.
# tor_proxy = false


