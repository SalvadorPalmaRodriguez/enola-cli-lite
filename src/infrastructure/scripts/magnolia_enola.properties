
# ── Ajustes de Enola (A25-N3) ────────────────────────────────────────────────
# Todo lo escribible vive en el volumen /data; la aplicación es de solo lectura.
magnolia.home=/data/magnolia
magnolia.author.key.location=/data/magnolia/keys/magnolia-activation-keypair.properties
magnolia.password.manager.key.location=/data/magnolia/keys/magnolia-password-manager-keypair.properties
# Repositorio JCR en PostgreSQL: el entrypoint genera este fichero (0600) desde la
# plantilla oficial con los datos de conexión.
magnolia.repositories.jackrabbit.config=/data/conf/jackrabbit-postgres.xml
# Superusuario: sin contraseña por defecto; se fija desde el secreto la primera vez
# (Magnolia >= 6.4.4) y se desactiva el formulario web de configuración inicial.
magnolia.superuser.bootstrap.password_file=/run/secrets/admin_password
magnolia.superuser.bootstrap.interactive_setup=false
# Instalación/actualización de módulos sin esperar un clic en el instalador web:
# el contenedor no tiene a nadie delante. Solo actúa al arrancar una imagen nueva.
magnolia.update.auto=true
